apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: node-crud-ingress
  labels:
    app: node-crud-web
    component: ingress
spec:
  ingressClassName: nginx
  rules:
    - host: inventario.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: node-crud-service
                port:
                  number: 8080
